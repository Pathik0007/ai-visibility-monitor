<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Visibility report -- {{ report.business }}</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="wrap" style="padding-top:24px;">
    <a class="back" href="{{ url_for('index') }}">← Run another check</a>
    <h1>{{ report.business }}</h1>
    <p class="sub">{{ category }} &middot; {{ location }}</p>

    <div class="share-bar">
      <span class="sub small">Saved for 24 hours at this link.</span>
      <button type="button" class="btn-ghost btn-sm" data-copy-link>Copy link</button>
    </div>

    {% include "_report_body.html" %}

    <div class="card cta-card">
      <h3 class="card-title">Track this every week</h3>
      <p class="sub small">We re-run these questions weekly and email you when your visibility changes or a competitor overtakes you.</p>
      <a class="btn btn-sm" href="{{ url_for('auth.signup') }}">Start monitoring →</a>
    </div>
  </div>
  <script src="/static/share.js" defer></script>
</body>
</html>
