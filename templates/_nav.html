{# Site-wide top bar. Logo always goes home; right side depends on login state. #}
<nav class="topnav">
  <a class="brand" href="{{ url_for('index') }}" aria-label="AI Visibility Monitor home"><span class="logo">◎</span> AI Visibility Monitor</a>
  <div class="navlinks">
    {% if current_user.is_authenticated %}
      <a class="btn-ghost nav-hide-sm" href="{{ url_for('index') }}">Free check</a>
      <a class="btn-ghost" href="{{ url_for('dashboard') }}">Dashboard</a>
      <a class="btn-ghost" href="{{ url_for('auth.logout') }}">Log out</a>
    {% else %}
      <a class="btn-ghost nav-hide-sm" href="{{ url_for('pricing') }}">Pricing</a>
      <a class="btn-ghost" href="{{ url_for('auth.login') }}">Log in</a>
      <a class="btn-ghost" href="{{ url_for('auth.signup') }}">Sign up</a>
    {% endif %}
  </div>
</nav>
