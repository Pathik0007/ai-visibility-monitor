<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow"><title>Sign up -- AI Visibility Monitor</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css"></head>
<body>
  {% include "_nav.html" %}
  <div class="wrap" style="max-width:420px; padding-top:32px;">
    <h1 class="center">Create your account</h1>
    <p class="sub center">Free to start — monitor a business, get weekly alerts.</p>
    {% with messages = get_flashed_messages() %}
      {% if messages %}<div class="notice">{{ messages[0] }}</div>{% endif %}
    {% endwith %}
    <form class="card" method="POST" data-loading-text="Creating account…">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required maxlength="255">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required minlength="8" maxlength="128">
      <button type="submit">Sign up</button>
    </form>
    <p class="sub">Already have an account? <a class="back" href="{{ url_for('auth.login') }}">Log in</a></p>
  </div>
  <script src="/static/form-loading.js" defer></script>
</body>
</html>
