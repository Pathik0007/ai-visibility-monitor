<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow"><title>Log in -- AI Visibility Monitor</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css"></head>
<body>
  <div class="wrap" style="max-width:420px; padding-top:60px;">
    <div class="brand" style="justify-content:center; margin-bottom:24px;"><span class="logo">◎</span> AI Visibility Monitor</div>
    <h1 class="center">Welcome back</h1>
    {% with messages = get_flashed_messages() %}
      {% if messages %}<div class="notice">{{ messages[0] }}</div>{% endif %}
    {% endwith %}
    <form class="card" method="POST" data-loading-text="Logging in…">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required maxlength="255">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required maxlength="128">
      <button type="submit">Log in</button>
    </form>
    <p class="sub">No account yet? <a class="back" href="{{ url_for('auth.signup') }}">Sign up</a></p>
  </div>
  <script src="/static/form-loading.js" defer></script>
</body>
</html>
