name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Compile check
        run: python -m compileall -q . -x '(\.venv|venv)/'
      - name: Tests (no network, no API keys -- every external call is mocked)
        run: python -m pytest
